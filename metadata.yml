Title: Antimicrobial activity prediction against Candida albicans from public ChEMBL and PubChem data
Description: Estimates antifungal activity against Candida albicans, the commonest cause of invasive candidiasis and an organism for which only a few drug classes exist. Seventeen classifiers were trained across separate ChEMBL and PubChem assay pools, giving broader coverage than most non-bacterial targets receive, and their outputs feed a quality-weighted consensus. Fungal cells share eukaryotic machinery with the host, so predicted activity warrants a cytotoxicity counter-screen.
